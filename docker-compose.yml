services:
  # Python FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Sync backend code for hot-reload (:Z for SELinux on Fedora)
      - ./backend:/app:Z
      # Mount CSV data folder
      - ./data:/app/data:Z
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Sync frontend code for hot-reload (:Z for SELinux on Fedora)
      - ./frontend:/app:Z
      # Use named volumes to persist and isolate node_modules and .next
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      # For client-side fetching
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    restart: unless-stopped

# Named volumes for persistent storage
volumes:
  frontend_node_modules:
  frontend_next:
